<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 456" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mqtt-payloads-title mqtt-payloads-desc" id="mqtt_payloads_diagram-root">
        <title id="mqtt-payloads-title">Cấu trúc JSON Payload MQTT gửi lên Server</title>
        <desc id="mqtt-payloads-desc">So sánh cấu trúc JSON của hai bản tin MQTT chính gửi lên Server: bản tin BBox và HUD realtime ở 25 FPS và bản tin sự kiện ùn tắc đã xác nhận.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #mqtt_payloads_diagram-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'Noto Sans', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #mqtt_payloads_diagram-root { font-family: var(--font-sans); color: var(--color-ink); }
      #mqtt_payloads_diagram-root .diagram-container { width: 100%; overflow-x: auto; }
      #mqtt_payloads_diagram-root .diagram-container { overflow-x: visible; }</style>
